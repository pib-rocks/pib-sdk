[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pib-sdk"
version = "0.5.0"
description = "SDK to control pib humanoid robot via rosbridge and solve its kinematics with Pinocchio from the official URDF"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }

authors = [
  { name = "pib.rocks", email = "team@pib.rocks" },
]

dependencies = [
  "pin>=3.1",       # Pinocchio kinematics backend (pip wheels, no system deps)
  "numpy>=1.22",
  "roslibpy>=1.6",  # rosbridge websocket client
]

classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Topic :: Scientific/Engineering :: Human Machine Interfaces",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "build", "twine"]
drawing = ["Pillow>=9.0"]

[project.scripts]
pib-control = "pib_sdk.control:_cli"

[project.urls]
Homepage = "https://github.com/pib-rocks/pib-sdk"

[tool.setuptools]
package-dir = { "" = "src" }
license-files = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pib_sdk = ["data/*.urdf"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
