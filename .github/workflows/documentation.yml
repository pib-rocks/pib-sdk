name: Documentation

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check public API coverage
        run: python tools/check_doc_coverage.py
      - name: Check internal links and anchors
        run: python tools/check_doc_links.py
      - name: Compile examples
        run: python tools/check_examples.py
